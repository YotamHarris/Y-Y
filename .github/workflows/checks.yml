name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # TestFlight waits for checks at its exact main commit; later pushes must not cancel them.
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r studio/manager-requirements.txt
      - run: npm run check
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: ruby tests/distribution_test.rb
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
      - name: Verify credential setup script
        run: ./tests/configure_test.ps1
      - uses: ./.github/actions/prefetch-sdl
      - run: ./scripts/build.ps1 -Smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: |
            build/windows/metrics.json
            build/windows/smoke.bmp
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode
        run: python3 scripts/ios-xcode.py
      - uses: ./.github/actions/prefetch-sdl
      - name: Identify simulator toolchain
        id: toolchain
        shell: bash
        run: |
          fingerprint=$( { xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-build-version; cmake --version; echo "$ImageOS-$ImageVersion"; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore configured simulator build
        id: simulator-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ios-simulator
          key: ios-simulator-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'scripts/ios-xcode.py', '.github/workflows/checks.yml') }}
      - run: cmake --preset ios-simulator
      - run: cmake --build build/ios-simulator --config Release --parallel 3 -- CODE_SIGNING_ALLOWED=NO
      - name: Save configured simulator build
        if: steps.simulator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/ios-simulator
          key: ${{ steps.simulator-cache.outputs.cache-primary-key }}
      - run: python3 scripts/ios-simulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-metrics
          path: build/ios-simulator/metrics.json
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prefetch-sdl
      - name: Install the pinned emsdk
        shell: bash
        run: |
          version=$(head -n 1 cmake/web/emsdk-version.txt)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$version"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$version"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - run: cmake --preset web
      - run: cmake --build build/web --parallel 3
      - uses: actions/upload-artifact@v4
        with:
          name: tapdemo-web
          path: build/web/site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke-test the web build in a phone-sized browser
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          python tests/web_smoke.py build/web/site build/web/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tapdemo-web-smoke
          path: build/web/smoke

