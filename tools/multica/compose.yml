name: yyengine-multica
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: multica
      POSTGRES_USER: multica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U multica -d multica]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    image: ghcr.io/multica-ai/multica-backend:v0.6.1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3071:8080"
    environment:
      DATABASE_URL: postgres://multica:${POSTGRES_PASSWORD}@postgres:5432/multica?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Required}
      APP_ENV: production
      FRONTEND_ORIGIN: ${MULTICA_APP_URL:-http://localhost:3072}
      CORS_ALLOWED_ORIGINS: ${MULTICA_APP_URL:-http://localhost:3072},http://localhost:3072
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:3072}
      MULTICA_PUBLIC_URL: ${MULTICA_APP_URL:-http://localhost:3072}
      MULTICA_DAEMON_API_URL: ${MULTICA_APP_URL:-http://localhost:3072}
      LOCAL_UPLOAD_BASE_URL: ${MULTICA_APP_URL:-http://localhost:3072}/uploads
      ALLOW_SIGNUP: "false"
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_TLS: ${SMTP_TLS:-implicit}
      SMTP_TLS_INSECURE: "false"
      DO_NOT_TRACK: "1"
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped
  frontend:
    image: ghcr.io/multica-ai/multica-web:v0.6.1
    depends_on: [backend]
    environment:
      HOSTNAME: "0.0.0.0"
      REMOTE_API_URL: http://backend:8080
    restart: unless-stopped
  gateway:
    image: nginx:1.28.0-alpine
    depends_on: [backend, frontend]
    ports:
      - "127.0.0.1:3072:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
